<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="background:#090d16; font-family:'Inter', system-ui, sans-serif;">
  <!-- Modal Background Shadow -->
  <rect x="0" y="0" width="800" height="600" fill="#000000" fill-opacity="0.6"/>
  
  <!-- Parameter Drawer Card -->
  <rect x="360" y="0" width="440" height="600" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Drawer Header -->
  <rect x="360" y="0" width="440" height="60" fill="#1e293b"/>
  <text x="390" y="36" fill="#ffffff" font-size="16" font-weight="bold">⚙️ Konfigurasi Parameter AI</text>
  <text x="760" y="36" fill="#94a3b8" font-size="16">✕</text>

  <!-- Section 1: API Key -->
  <rect x="380" y="80" width="400" height="75" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="395" y="103" fill="#cbd5e1" font-size="12" font-weight="600">GOOGLE GEMINI API KEY</text>
  <rect x="650" y="90" width="115" height="18" rx="9" fill="#064e3b"/>
  <text x="660" y="103" fill="#34d399" font-size="9">Built-in Fallback Engine</text>
  <rect x="395" y="115" width="370" height="30" rx="6" fill="#1e293b"/>
  <text x="410" y="134" fill="#64748b" font-size="11" font-family="monospace">AIzaSy... (Biarkan kosong untuk demo mode)</text>

  <!-- Section 2: Persona -->
  <text x="380" y="180" fill="#a5b4fc" font-size="12" font-weight="bold">👤 GAYA BAHASA &amp; PERSONA AI</text>
  <rect x="380" y="190" width="400" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="395" y="213" fill="#f8fafc" font-size="12">Tech Lead / Mentor Senior (Profesional &amp; Best Practice)</text>

  <!-- Section 3: Domain -->
  <text x="380" y="255" fill="#38bdf8" font-size="12" font-weight="bold">📚 DOMAIN PENGETAHUAN SPESIFIK</text>
  <rect x="380" y="265" width="400" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="395" y="288" fill="#f8fafc" font-size="12">Web Development &amp; Full-Stack (JS/TS, React, Node)</text>

  <!-- Section 4: Creativity / Temperature Slider -->
  <rect x="380" y="320" width="400" height="75" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="395" y="343" fill="#cbd5e1" font-size="12" font-weight="600">CREATIVITY / TEMPERATURE</text>
  <text x="730" y="343" fill="#818cf8" font-size="13" font-weight="bold" font-family="monospace">0.7</text>
  <rect x="395" y="355" width="370" height="8" rx="4" fill="#1e293b"/>
  <rect x="395" y="355" width="260" height="8" rx="4" fill="#6366f1"/>
  <circle cx="655" cy="359" r="8" fill="#ffffff"/>

  <!-- Section 5: Memory Toggle -->
  <rect x="380" y="410" width="400" height="55" rx="10" fill="#020617" stroke="#1e293b"/>
  <text x="395" y="433" fill="#ffffff" font-size="12" font-weight="bold">🧠 Fitur Memori Percakapan</text>
  <text x="395" y="450" fill="#64748b" font-size="10">Mengingat konteks &amp; preferensi multi-turn chat</text>
  <rect x="720" y="425" width="45" height="24" rx="12" fill="#059669"/>
  <circle cx="753" cy="437" r="9" fill="#ffffff"/>

  <!-- Section 6: Tool Integrations -->
  <text x="380" y="490" fill="#cbd5e1" font-size="12" font-weight="bold">🔌 INTEGRASI API &amp; MODUL TOOL</text>
  <text x="395" y="515" fill="#38bdf8" font-size="11">☑ GitHub REST API  ☑ Live Weather API  ☑ HackerNews  ☑ JS Sandbox</text>

  <!-- Footer Button -->
  <rect x="380" y="540" width="400" height="42" rx="8" fill="#4f46e5"/>
  <text x="510" y="566" fill="#ffffff" font-size="13" font-weight="bold">Simpan Konfigurasi AI</text>
</svg>
