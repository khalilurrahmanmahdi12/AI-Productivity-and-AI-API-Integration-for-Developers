<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family:'Inter', system-ui, sans-serif;">
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="15" width="30" height="30" rx="8" fill="url(#gradLogo)"/>
  <defs>
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <text x="60" y="34" fill="#ffffff" font-size="16" font-weight="bold">DevPulse AI</text>
  <text x="60" y="48" fill="#64748b" font-size="11" font-family="monospace">v1.0 Developer Assistant</text>

  <!-- Header Badges -->
  <rect x="720" y="17" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="735" y="34" fill="#818cf8" font-size="11" font-weight="600">🤖 Tech Lead / Mentor</text>

  <rect x="880" y="17" width="140" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="895" y="34" fill="#38bdf8" font-size="11" font-weight="600">💻 Web Development</text>

  <rect x="1030" y="17" width="90" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <text x="1045" y="34" fill="#34d399" font-size="11" font-weight="600">🟢 Memory On</text>

  <rect x="1130" y="15" width="50" height="30" rx="6" fill="#4f46e5"/>
  <text x="1145" y="35" fill="#ffffff" font-size="12">⚙️</text>

  <!-- Sidebar -->
  <rect x="0" y="60" width="260" height="615" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="15" y="75" width="230" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="35" y="98" fill="#818cf8" font-size="13" font-weight="600">+ Sesi Chat Baru</text>

  <!-- Sidebar History Items -->
  <rect x="15" y="125" width="230" height="36" rx="6" fill="#312e81" stroke="#4f46e5" stroke-width="1"/>
  <text x="30" y="148" fill="#e0e7ff" font-size="12" font-weight="500">💬 Refactor Async JS Code</text>

  <rect x="15" y="170" width="230" height="36" rx="6" fill="#1e293b" stroke="#1e293b"/>
  <text x="30" y="193" fill="#94a3b8" font-size="12">💬 GitHub Repo Facebook React</text>

  <rect x="15" y="215" width="230" height="36" rx="6" fill="#1e293b" stroke="#1e293b"/>
  <text x="30" y="238" fill="#94a3b8" font-size="12">💬 Weather Dev Hub Tokyo</text>

  <!-- Main Feed Area -->
  <!-- User Message -->
  <rect x="680" y="85" width="480" height="55" rx="16" fill="#4f46e5"/>
  <text x="700" y="118" fill="#ffffff" font-size="13">Tolong refactor kode async fetch ini agar sesuai best practice clean code.</text>

  <!-- AI Response Message -->
  <rect x="290" y="155" width="870" height="420" rx="16" fill="url(#gradCard)" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Tool Badge -->
  <rect x="315" y="175" width="180" height="24" rx="12" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="330" y="191" fill="#a5b4fc" font-size="11" font-weight="600">⚡ Code Optimizer Engine</text>

  <text x="315" y="230" fill="#f8fafc" font-size="15" font-weight="bold">### 🛠️ Async JavaScript Refactoring Guide</text>
  <text x="315" y="255" fill="#cbd5e1" font-size="13">Berikut adalah contoh refactoring menggunakan Async/Await &amp; Guard Clause pattern:</text>

  <!-- Code Block -->
  <rect x="315" y="275" width="820" height="200" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="330" y="300" fill="#38bdf8" font-size="12" font-family="monospace">async function</text>
  <text x="430" y="300" fill="#818cf8" font-size="12" font-family="monospace">fetchUserData</text>
  <text x="535" y="300" fill="#f8fafc" font-size="12" font-family="monospace">(userId) {</text>
  <text x="350" y="325" fill="#f8fafc" font-size="12" font-family="monospace">try {</text>
  <text x="370" y="350" fill="#f8fafc" font-size="12" font-family="monospace">const res = await fetch(`https://api.github.com/users/${userId}`);</text>
  <text x="370" y="375" fill="#f8fafc" font-size="12" font-family="monospace">if (!res.ok) throw new Error('Failed to fetch user');</text>
  <text x="370" y="400" fill="#f8fafc" font-size="12" font-family="monospace">return await res.json();</text>
  <text x="350" y="425" fill="#f8fafc" font-size="12" font-family="monospace">} catch (err) { console.error('Error:', err.message); }</text>
  <text x="330" y="450" fill="#f8fafc" font-size="12" font-family="monospace">}</text>

  <!-- Run Sandbox Button -->
  <rect x="1020" y="285" width="100" height="28" rx="5" fill="#059669"/>
  <text x="1035" y="303" fill="#ffffff" font-size="11" font-weight="bold">▶ Run Code</text>

  <!-- Bottom Input Bar -->
  <rect x="260" y="600" width="940" height="75" fill="#0f172a" stroke="#1e293b"/>
  <rect x="290" y="612" width="820" height="48" rx="10" fill="#020617" stroke="#334155"/>
  <text x="310" y="641" fill="#64748b" font-size="13">Ketik pertanyaan atau panggil API (e.g. 'github repo facebook/react')...</text>
  <rect x="1120" y="612" width="48" height="48" rx="10" fill="#4f46e5"/>
  <text x="1136" y="641" fill="#ffffff" font-size="16">🚀</text>
</svg>
