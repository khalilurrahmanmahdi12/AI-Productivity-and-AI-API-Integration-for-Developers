<!DOCTYPE html>
<html lang="id" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPulse AI — Smart Developer Workspace</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <!-- Marked parser for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Prism.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-[#0e1017] text-slate-100 font-sans antialiased h-full flex flex-col overflow-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Header / Navigation Bar -->
  <header class="h-14 border-b border-slate-800/60 bg-[#131622]/90 backdrop-blur-md px-4 flex items-center justify-between z-30 shrink-0 w-full">
    <div class="flex items-center gap-3">
      <button id="toggle-sidebar-btn" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="panel-left" class="w-5 h-5"></i>
      </button>
      
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
          <i data-lucide="cpu" class="w-4 h-4"></i>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-sm text-slate-100 tracking-tight">DevPulse AI</span>
          <span id="badge-persona-text" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Tech Lead / Mentor</span>
        </div>
      </div>
    </div>

    <!-- Active Configurations & Control Buttons -->
    <div class="flex items-center gap-2.5">
      <div id="badge-domain-text" class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-400 px-2.5 py-1 rounded-md bg-slate-800/50 border border-slate-800">
        <i data-lucide="code-2" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span>Web Development</span>
      </div>

      <div id="badge-memory-status" class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-400 font-mono">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Memory On
      </div>

      <button id="open-settings-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs shadow-md transition active:scale-95">
        <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
        <span>Konfigurasi</span>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="flex-1 flex overflow-hidden relative w-full">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 border-r border-slate-800/60 bg-[#131622] flex flex-col transition-all duration-300 z-20 shrink-0">
      <div class="p-3 border-b border-slate-800/60">
        <button id="new-chat-btn" class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-slate-800/80 hover:bg-indigo-600 hover:text-white text-slate-200 border border-slate-700/60 text-xs font-semibold transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Sesi Chat Baru
        </button>
      </div>

      <!-- Chat Sessions List -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chat-sessions-list">
        <!-- Sessions rendered dynamically -->
      </div>

      <!-- Sidebar Footer -->
      <div class="p-3 border-t border-slate-800/60 bg-[#131622] space-y-2 text-xs">
        <div class="flex items-center justify-between text-slate-400 px-1">
          <span class="text-[10px] font-bold uppercase tracking-wider">Ekspor History</span>
          <button id="clear-all-sessions-btn" title="Hapus Semua Sesi" class="hover:text-red-400 transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button id="export-md-btn" class="py-1.5 px-2 rounded bg-slate-800/60 hover:bg-slate-800 text-slate-300 text-[11px] border border-slate-700/50 transition">
            Markdown
          </button>
          <button id="export-json-btn" class="py-1.5 px-2 rounded bg-slate-800/60 hover:bg-slate-800 text-slate-300 text-[11px] border border-slate-700/50 transition">
            JSON
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Chat Content -->
    <main class="flex-1 flex flex-col bg-[#0e1017] overflow-hidden w-full relative">

      <!-- Scrollable Chat Feed -->
      <div id="chat-feed" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 w-full max-w-4xl mx-auto">
        <!-- Messages rendered dynamically -->
      </div>

      <!-- Input Area -->
      <div class="p-4 bg-[#0e1017] w-full max-w-4xl mx-auto">
        
        <!-- Prompt Presets Bar -->
        <div id="quick-prompts-container" class="mb-3 overflow-x-auto no-scrollbar flex items-center gap-2">
          <!-- Dynamic prompt tags -->
        </div>

        <form id="chat-form" class="relative flex flex-col gap-2">
          <div class="relative flex items-center rounded-2xl bg-[#161926] border border-slate-800 focus-within:border-indigo-500/80 transition shadow-xl">
            <textarea
              id="user-input"
              rows="2"
              placeholder="Apa yang ingin Anda kembangkan hari ini? (e.g. refactor kode, github repo, cuaca dev hub...)"
              class="w-full bg-transparent px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none resize-none font-sans leading-relaxed"
            ></textarea>
            
            <div class="flex items-center gap-2 pr-3 shrink-0">
              <button
                type="button"
                id="voice-input-btn"
                title="Voice Input"
                class="p-2 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-indigo-400 transition"
              >
                <i data-lucide="mic" class="w-4 h-4"></i>
              </button>
              
              <button
                type="submit"
                id="send-btn"
                class="p-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-semibold text-xs shadow-md transition flex items-center justify-center"
              >
                <i data-lucide="send" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-[11px] text-slate-500 px-1">
            <span class="flex items-center gap-3">
              <span>API Active: <strong class="text-slate-400">GitHub, Weather, HackerNews, Sandbox</strong></span>
            </span>
            <span id="token-usage-counter" class="font-mono">Memory Context: 0 msgs</span>
          </div>
        </form>
      </div>

    </main>

  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex justify-end transition-opacity">
    <div class="w-full max-w-md bg-[#131622] border-l border-slate-800 h-full flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="sliders" class="w-5 h-5 text-indigo-400"></i>
          <h2 class="font-bold text-sm text-slate-100">Konfigurasi Parameter AI</h2>
        </div>
        <button id="close-settings-btn" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Settings Form -->
      <div class="flex-1 overflow-y-auto p-4 space-y-5">

        <!-- API Key Configuration -->
        <div class="space-y-1.5 bg-[#0e1017] p-3.5 rounded-xl border border-slate-800">
          <label class="block text-xs font-semibold text-slate-300 flex items-center justify-between">
            <span>Google Gemini API Key</span>
            <span class="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded font-mono">Optional</span>
          </label>
          <input
            type="password"
            id="api-key-input"
            placeholder="AIzaSy... (Kosongkan untuk demo mode)"
            class="w-full px-3 py-2 text-xs rounded-lg bg-[#161926] border border-slate-700 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono"
          />
        </div>

        <!-- Gaya Bahasa / Persona -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Gaya Bahasa & Persona AI</label>
          <select id="persona-select" class="w-full px-3 py-2 text-xs rounded-lg bg-[#161926] border border-slate-700 text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="tech_lead">Tech Lead / Mentor Senior (Profesional & Best Practice)</option>
            <option value="santai">Santai / Casual (Gaya Peer Developer)</option>
            <option value="code_optimizer">Code Optimizer (Direct to Code, High Efficiency)</option>
            <option value="formal">Formal & Structured (Bahasa Baku & Dokumentasi Rapi)</option>
            <option value="eli5">ELI5 (Explain Like I'm 5)</option>
          </select>
        </div>

        <!-- Domain Pengetahuan -->
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Domain Pengetahuan Spesifik</label>
          <select id="domain-select" class="w-full px-3 py-2 text-xs rounded-lg bg-[#161926] border border-slate-700 text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="webdev">Web Development & Full-Stack (JS/TS, React, Node, CSS)</option>
            <option value="datascience">Data Science & AI/ML (Python, PyTorch, SQL)</option>
            <option value="devops">DevOps, Docker & Cloud Architecture</option>
            <option value="system_design">System Design & Security</option>
            <option value="career">Career & Productivity</option>
          </select>
        </div>

        <!-- Temperature Slider -->
        <div class="space-y-2 bg-[#0e1017] p-3.5 rounded-xl border border-slate-800">
          <div class="flex items-center justify-between">
            <label class="text-xs font-semibold text-slate-300">Creativity / Temperature</label>
            <span id="temp-value-display" class="font-mono text-xs text-indigo-400 font-bold">0.7</span>
          </div>
          <input
            type="range"
            id="temperature-slider"
            min="0.0"
            max="1.0"
            step="0.1"
            value="0.7"
            class="w-full accent-indigo-500 cursor-pointer"
          />
        </div>

        <!-- Memory Toggle -->
        <div class="space-y-2 bg-[#0e1017] p-3.5 rounded-xl border border-slate-800">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs font-semibold text-slate-200">Fitur Memori Percakapan</div>
              <div class="text-[11px] text-slate-400">Mengingat konteks percakapan</div>
            </div>
            <input type="checkbox" id="memory-toggle" checked class="w-4 h-4 accent-indigo-500 cursor-pointer">
          </div>
          <button id="clear-memory-btn" class="w-full py-1.5 px-3 rounded-lg bg-slate-800 hover:bg-red-500/20 text-slate-300 text-xs border border-slate-700 transition flex items-center justify-center gap-1.5">
            Reset Memori Sesi Ini
          </button>
        </div>

        <!-- Tool Integrations -->
        <div class="space-y-2 bg-[#0e1017] p-3.5 rounded-xl border border-slate-800 text-xs">
          <label class="block text-xs font-semibold text-slate-300 mb-2">Integrasi API & Tools</label>
          <label class="flex items-center justify-between text-slate-300">
            <span>GitHub REST API</span>
            <input type="checkbox" id="tool-github" checked class="accent-indigo-500">
          </label>
          <label class="flex items-center justify-between text-slate-300">
            <span>Live Weather & Timezone API</span>
            <input type="checkbox" id="tool-weather" checked class="accent-indigo-500">
          </label>
          <label class="flex items-center justify-between text-slate-300">
            <span>Developer Tech News Feed</span>
            <input type="checkbox" id="tool-news" checked class="accent-indigo-500">
          </label>
          <label class="flex items-center justify-between text-slate-300">
            <span>In-Chat JS Code Executor</span>
            <input type="checkbox" id="tool-sandbox" checked class="accent-indigo-500">
          </label>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-800 flex gap-2">
        <button id="save-settings-btn" class="w-full py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition">
          Simpan Konfigurasi
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
